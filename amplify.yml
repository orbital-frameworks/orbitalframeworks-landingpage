version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo dnf install -y ImageMagick || sudo yum install -y ImageMagick
        - npm ci
        - npm run lint
    build:
      commands:
        - npm run build
        - npm test
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
