customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate, s-maxage=300
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/portfolio/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, s-maxage=31536000
  - pattern: '/sitemap.xml'
    headers:
      - key: Cache-Control
        value: public, max-age=3600, s-maxage=3600
  - pattern: '/robots.txt'
    headers:
      - key: Cache-Control
        value: public, max-age=3600, s-maxage=3600
  - pattern: '/llms.txt'
    headers:
      - key: Cache-Control
        value: public, max-age=3600, s-maxage=3600
